<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table{
        border-collapse: collapse;
        text-align: center;
        width: 800px;
    }
    thead th{
    border: 1px solid black;
    background-color: rgb(216, 54, 54);
    color: white;
    }
    tbody td{
    border: 1px solid black;
    }
    tfoot td{
        background-color: rgb(0, 0, 0);
        color: white;
        border: 1px solid black;
    }
</style>
<body>
    <table>
        <thead>
            <tr>
                <th>방이름</th>
                <th>대상</th>
                <th>인실</th>
                <th>가격</th>
            </tr>
        </thead>
            <tr>
                <td>유채방</td>
                <td>여성전용</td>
                <td rowspan="3">4인실</tdㅣ>
                <td rowspan="3">1팀 30,000원</td>              
            </tr>
            <tr>
                <td>동백방</td>
                <td>남성전용</td>            
            </tr>
            <tr>
                <td>백합방</td>
                <td>커플전용</td>
             
            </tr>
            <tr>
                <td>튤립방</td>
                <td>가족전용</td> 
                <td>4인실</td> 
                <td>100,000원(4인 기준 1팀당)</td> 
            </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="4">모든 준비 재료가 포함된 바베큐장을 렌트해드립니다.(가격:<del>150,000</del> &rarr; 100,00원/4인기준)</td>
        </tr>
        </tfoot>
    </table>
</body>
</html>
