<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 연습</title>
    <style>
        .container{
            /* 부모요소가 아니라 자식요소를 가로 배치한다.
               = position과 마찬가지로 부모를 지정하고 들어가야함

            */
            display: flex;
            flex-direction: row;
            /* 부모의 가로 너비가 자식 요소전체의 너비 보다 작을 때
               자동 개행 속성을 지정한다.
               flex-wrap : wrap(줄바꿈), nowrap(줄바꿈 안함)
            */
            flex-wrap: wrap;
            width: 500px;
            /* height: 400px; */
            border: 1px solid blue;
            /* 자식요소를 부모요소의 가운데로 배치한다. */
            /* justify-content: center; */
            /* 자식요소를 부모요소의 가운데로 정렬(사이드 공백 생김) */
            /* justify-content: space-around; */
            /* 요소사이의 공백 일정하게 지정(사이드는 공백 안생김) */
            justify-content: space-between;
            /* 요소 사이의 공백을 전부 일정하게 지정 ★(사이드 공백 까지)*/
            /* justify-content: space-evenly; */
             
        }

        .container .box{
            width: 100px;
            height:  100px;
            border:  1px solid red;
            background-color: crimson;
            border-radius: 5px;
            /* margin: 5px; */
            color: white;
        }
        
    </style>
</head>
<body>

   <div class="container">
        <div class="box">box1</div>
        <!-- <div class="box">box2</div>
         <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
        <div class="box">box6</div>
        <div class="box">box7</div> -->
        <div class="box">box8</div>
   </div>
</body>
</html>
