       //DOM

        }

            //

                // product_list += `<li><span class='pro'>${menus[i].name}(${menus[i].type})</span>`,menus[i].quantity,`개`, menus[i].price*menus[i].quantity,`</li>`;

                sum += menus[i].price*menus[i].quantity
                
            }
            total_price.innerHTML = `총 합계 : ${sum}`

            function plus(i){

            }

                }else{
                menus[i].quantity++}
            }

        
    </script>
