<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex3</title>
    <style>
        html{
            height: 100%;
        }
        body{
            display: flex;
            height: 100% ;
            justify-content: center;
            align-items: center;
            /* height: ; */
            
            /* justify-content: center; */
            /* align-self: flex-start; */
            /* flex-grow: 1; */
            /* flex-direction: column; */
            /* border: 1px solid black; */
            /* margin: auto; */
        }
        div{
            width: 400px;
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 0px 0px 10px #ccc;
            margin-top: 20px;
            margin-top: 10px ;
        }


        h2{
            width: 400px;
            text-align: center;

        }
        input{
            width: 333px;
            margin: 5px 10px;
            margin-left: 20px;
            height: 40px;          
            border-radius: 5px;  
            border: none;
            border: 1px solid #ccc;
            padding: 2px 15px 0 5px;
        }
        button{
            margin-top: 40px;
            width: 356.48px;
            margin: 5px 10px;
            margin-left: 20px;
            margin-bottom: 30px;
            height: 50px;
            border-radius: 5px;
            border: none;
            background-color: rgb(248, 100, 63);
            font-size: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <input type="text" placeholder="아이디 입력" />
        <input type="password" placeholder="비밀번호 입력" />
        <button>로그인</button>
    </div>

</body>
</html>
