<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="/OOZY/login.css">
</head>
<body>
    <section id="section">
     <div.main>   
        <form action="#" method="get">
                <div class="main1">
                    <h1>OOZY COFFEE</h1>
                        <input type="text" id="id" placeholder="아이디를 입력해주세요">
                        <label for="id>"></label>
                        <input type="password" id="password" placeholder="비밀번호를 입력해주세요">
                        <label for="password"></label>
                        <button type="submit">로그인</button>
                </div>
            </form>
            <div class="main2">
                <div class="logintype">
                    <div>
                    <input type="checkbox" id="chk" >
                    <label for="chk">로그인상태 유지</label>
                    </div>
                    <div>
                    <a href="#" class="accountfound">아이디·비밀번호 찾기</a>
                    </div>
                </div>
                <div class="snslogin">
                    <h3>SNS간편 로그인</h3>
                    <div class="sns">
                        <a href="#" class="naver"><img src="/OOZY/images/sns_naver.svg" alt=""></a>
                        <a href="#" class="kakao"><img src="/OOZY/images/sns_kakao.svg" alt=""></a>
                        <a href="#" class="facebook"><img src="/OOZY/images/sns_facebook.svg" alt=""></a>
                        <a href="#" class="google"><img src="/OOZY/images/sns_google.svg" alt=""></a>
                        <a href="#" class="apple"><img src="/OOZY/images/sns_apple.svg" alt=""></a>
                    </div>
                </div>
            </div>
            <div class="main3">
                <div>
                <a href="member.html">회원가입</a>
                </div>
                <p class="event">회원가입 하면 <span>10만원 쿠폰팩</span>을 드려요!</p>
            </div>
        </div>
    </section>
</body>
</html>
