<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인라인 & 블록</title>
    <style>
        body{
            font-family: sans-serif;
            font-size: 20px;
            color: black;
        }
        div{
            border: 1px solid red;
            height: 50px;
        }
        a{
            /* a태그의 문자색은 반드시 a태그 안에서만 변경 가능 */
            color: black;
            text-decoration: none;
            /* a태그는 인라인으로 크기를 가질수 없다 */
            /* display:inline-block을 통해야만 조절이 가능함 */
            display: inline-block;
            width: 100px;
            border: 1px solid blue;
            text-align: center;
        }
    </style>
</head>
<body>
    <a href="https://www.naver.com">네이버</a>
    <a href="https://www.google.com">구글</a>
    <a href="https://www.daum.net">다음</a>

    <hr>
    <div>box1</div>
    <div>box2</div>
    <div>box3</div>
</body>
</html>
