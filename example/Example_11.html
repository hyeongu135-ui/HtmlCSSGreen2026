<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Coffee Beans of the World</title>
    <style>
        h1{
            text-align: center;
            width: 600px;
            background-color: black;
            color: white;
            font-size: 20px;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 13px;
            box-shadow: 5px 5px 5px gray;

        }
        ul{
            padding : 0;
            list-style: none;
        }
        li{
            text-align: left;
            padding: 4px;
        }

        .Ethiopia,.Colombia_Supremo,.Guatemala_Antigua{
            color: blue;
            font-size: 17px;
            text-decoration: underline;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h1>Best Coffee Beans of the World</h1>
    <form action="#" method="?">
        <ul>
            <li>
                <span class="Ethiopia">Ethiopia Yirgacheffe</span> : Know for its bright acidity and floral, citrus notes.
            </li>
            <li>
                <span class="Colombia_Supremo">Colombia Supremo</span> : Balanced flavor with a nutty, caramel sweetness.
            </li>
            <li>
                <span class="Guatemala_Antigua">Guatemala Antigua</span> : Rich body with smoky, chocolate undertones.
    </form>

</body>
</html>
