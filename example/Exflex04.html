<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;

        }
        body{
            margin: 0 auto;
            background-color: #f2f3f2;
        }
        
        ul{
            list-style: none;
            margin-bottom: 10px;
        }
        li{
            margin: 7px;
        }
        .main{
            display: flex;
            justify-content: center;
            box-shadow: 0 0 20px #808380;
            margin: 40px auto;
            background-color: #ffffff;
            width: 400px;
            border-radius: 10px;
            padding: 30px;
        }

        /* label 인라인 태그에 부모요소인 form_group에 display : flex를
            지정하므로 인라인 요소도 너비, 높이를 가질 수 있게 변함을 주의하자.
        */ 
        label{
            display: inline-block;
            width: 100px;
            margin-right: 0px ;
        }
        input{
            border-radius: 3px;
            border: 1px solid #b8b8b8;
            width: 200px;
            height: 25px;
            padding-left: 5px;
        }
        button{
            margin-top: 10px ;
            width: 312px;
            height: 35px;
            border: 0;
            background-color: rgb(9, 173, 36);
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="main">
        <form action="#" method="get">
            <ul>
                <li class="menu name">
                    <label for="name">이름</label>
                    <input type="text" id="name" placeholder="홍길동">
                </li>
                <li class="menu email">
                    <label for="email">이메일</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </li>
                <li class="menu paswd">
                    <label for="paswd">비밀번호</label>
                    <input type="password" id="paswd">
                </li>
                <li class="menu repas">
                    <label for="repas">비밀번호 확인</label>
                    <input type="repas" id="repas">
                </li>
            </ul>
            <button type="submit">회원가입</button>
        </form>
    </div>
</body>
</html>
