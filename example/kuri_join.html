<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마켓컬리 회원가입</title>
    <link rel="stylesheet" href="/StyleCss/kuri_join.css">
</head>
<body>
    <h1>회원가입</h1>
    <p><span class="sp">*</span>필수입력사항</p>
    <hr style="color: black;" width="600">
    <form>
        <ul>
            <li>
                <label for="ID">아이디<span class="sp">*</span></label>
                <input type="text" id="ID">
            </li>
            <li>
                <label for="password">비밀번호<span class="sp">*</span></label>
                <input type="password" id="password">
            </li>
            <li>
                <label for="passwordchk">비밀번호확인<span class="sp">*</span></label>
                <input type="password" id="passwordchk">
            </li>
            <li>
                <label for="name">이름<span class="sp">*</span></label>
                <input type="text" id="name">
            </li>
            <li>
                <label for="email">이메일</label>
                <input type ="text" id="email">
                <select>
                    <option value="" disabled aria-placeholder="선택하기"></option>
                </select>
            </li>
            <li>
                <label for="tel">휴대폰<span class="sp">*</span></label>
                <input type="tel" id="tel">
            </li>
            <li>
                <button>🔍️주소검색</button>
                <Pre>배송지에 따라 상품 정보가 달라질 수 있습니다.</Pre>
            </li>
            <li>
                <span class="gender">성별</span>
                <input type="radio" name="gen"checked id="man">
                <label for = "man">남자</label>
                <input type="radio" name="gen" id="woman">
                <label for="woman">여자</label>
                <input type="radio" name="gen" id="x">
                <label for="x">선택안함</label>
            </li>
            <li>
                <label for="생년월일">생년월일</label>
                <input type= "text">
            </li>
        </ul>
    </form>
</body>
</html>
