<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>간단한 설문</h1>
    <form>
        <ul>
            <li>좋아하는 과일 선택
                <select>
                <option value="사과">사과</option>
                <option value="바나나">바나나</option>
                <option value="딸기">딸기</option>
                <option value="포도">포도</option>
                </select>
            </li>
            <li>
                <label>취미(복수 선택 가능)</label>
                <input type="checkbox" value="1" >독서
                <input type="checkbox" value="2" >운동
                <input type="checkbox" value="3" >음악
                <input type="checkbox" value="4" >여행
            </li>

            <li>
                <label>성별 선택:</label>
                <label><input type="radio" name="gender" value="남성" checked>남성</label>
                <label><input type="radio" name="gender" value="남성">여성</label>
            </li>
            <li>
                <label for="content">추가의견:</label><br>
                <textarea id="content" name="comment" placeholder="의견을 입력하시오"></textarea>

            </li>
        </ul>
    </form>
</body>
</html>
