<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서식</title>
    <style>
        /* 
            1.px : 고정단위 (반응형/접근성에 불리함)
            2.em : 부모를 기준 상대단위
            3.rem : 최상위(html) 기준 상대 단위(현대 반응형 웹 표준 단위)

        */
        html{font-size: 15px;}
        body{
            /* 기본 폰트크기 16px */
            font-size: 14px;
            font-family: sans-serif;
            /* line-height : 줄사이 간격 = rem쓰는게 편리함*/
            /* line=height를 24px과 같이 고정 단위를 지정하면
               font-size사이를 변경해도 줄간격이 고정됨
               글짜 크기가 변경됨에 따라 맞춰서 줄 간격도 변경되게 하려면
               rem, em을 활용한다.
            */
            line-height: 1.6rem;
            color: #333;

        }
        h3{
            font-size: 1.5rem; /* 16*1.5 = 24px */
            font-weight: 700;
            color: #111;
            text-decoration: underline;
        }
        a{
            /* a태그의 하이퍼 링크 스타일 삭제 CSS */
            text-decoration: none;
        }
        p{font-size: 1.2rem;}
        p.text{
            /* 기울임꼴 CSS */
            font-style: italic;
            /* 자동 줄 바꿈 CSS
                - normal = o
                - nowrap = X
                - white-space 기본값 = normal
            */
            white-space : nowrap;
            /* 자동 줄 바꿈이 되지 않은 상태에서 텍스트가 넘친 경우 감추는 CSS */
            overflow: hidden;
            /* 넘친 텍스트 부분을 ....으로 감추는 CSS */
            /* clip(기본값) */
            text-overflow: ellipsis;
        }
        p.copy{
            /* 첫글자만 대문자 CSS : 단어별 대문자로 수정 CSS*/
            text-transform: capitalize;
            /* 문자 자간 조정 CSS */
            letter-spacing: 2px;
            /* 단어 간격 조정 CSS */
            word-spacing: 5px;
        }

    </style>
</head>
<body>
    <h3>CSS 서식관련 속성</h3>
    <a href="">네이버</a>
    <p class="text">
        든 창공에 너의 쓸쓸한 이것이다. 자고 가는 속에 기쁘며, 칼이다
        트고, 보는 들어 만물은 있다. 찾아다녀도, 따뜻한 품고 그것은 무엇이 그들의
        굳세계 아니더면, 뜨고, 뿐이다. 작고 구할 붙잡아 쓸쓸하라? 것은 불러 얼마나 위하여
        석가는 있으랴?
    </p>
    <p class="copy">copyright all reserved by hangul 2026</p>
</body>
</html>
