<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>item</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .box{
            background-color: whitesmoke;
            width: 1400px;
            height: 500px;
            border: 1px solid black;
            margin: 0 auto;
        }
        .box .card{
            box-shadow: 5px 5px 20px gray;
            display: inline-block;
            border-radius: 10px;
            /* padding: 0px ; */
            text-align: center;
            margin: 30px;
            width: 400px;
        }
        img{
            border-radius: 10px 10px 0px 0px;
            width: 400px;
        }
        .h1{
            border: 1px solid white;
            text-align: center;
        }
        p{
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
            margin: 10px;

        }
    </style>
</head>
<body>
    <div class="box">
        <div class="card">
            <img src="/images/product1.jpg">
            <h1>Wireless Earbuds</h1>
            <p>This is a long product description text that will be truncated</p>
        </div>
        <div class="card">
            <img src="/images/product2.jpg">
            <h1>Smart Watch</h1>
            <p>Track your health and fitness goals easily every single day</p>
        </div>
        <div class="card">
            <img src="/images/product3.jpg">
            <h1>Bluetooth Speaker</h1>
            <p>Portable speaker with powerful sound and long battery life</p>
        </div>
    </div>    
</body>
</html>
