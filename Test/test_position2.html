<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fixed 포지션</title>
    <style>
        .parent{
            background-color: dodgerblue;
            width: 800px;
            height: 300px;
            position: relative;
        }
        .child{
            background-color: crimson;
            width: 200px;
            height: 100px;
            position: absolute;
            right: 20px;
            bottom: 50px;
            /* left: 0;
            top: 0; */
        }
        .parent02{
            border: 1px solid red;
            width: 600px;
            height: 300px;
            margin: 0 auto;
            position: relative;
        }
        /* 공통 box CSS */
        .box{
            width: 100px;
            height: 100px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            /* border: 1px solid blue; */
            display: inline-block;
            position: absolute;
        }
        /* 포지션 없으면 t,r,l,b, 사용불가 */
        /* 부모 안쪽 */
.inline-top-left{
    background-color: orange;
    top: 0;
    left: 0;
}
.inline-top-right{
     background-color: orange;
     top: 0;
     right: 0;
}
.inline-bottom-left{
     background-color: orange;
     bottom: 0;
     left: 0;
}
.inline-bottom-right{
     background-color: orange;
     bottom: 0;
     right: 0;
}
.inline-center{
    background-color: crimson;
    /* 부모의 정가운데 위치 
        자식요소의 왼쪽의 top의 위치가 정가운데로 이동한다.
        다만, 자식요소 전체가 정가운데로 이동하지는 않는다.
    */
    top: 50%;
    left: 50%;
    /* right: 40%; */
    /* bottom: 40%; */
    transform: translate(-50%,-50%);
}
.child1{
     background-color: dodgerblue;
     top: 100%; /*top:100% = top:300px = 부모의 높이*/
     left: 0px;
     font-size: 24px;
}
.child2{
     background-color: dodgerblue;
     top:0;
     /* left:100% = left 600px = 부모의 너비 */
     left: 100%; 
}
.child3{
     background-color: dodgerblue;
     top: 100%;
     left: 100%;
}
    </style>
    <div class="parent">
        <div class="child"></div>
    </div>
    <hr>
    <div class="parent02">
        <div class="box inline-top-left">top:0<br>left:0</div>
        <div class="box inline-top-right">top:0<br>right:0</div>
        <div class="box inline-bottom-left">bottom:0<br>left:0</div>
        <div class="box inline-bottom-right">bottom:0<br>right:0</div>
        <div class="box inline-center">bottom:0<br>right:0</div>
        <div class="box child1">1</div>
        <div class="box child2">2</div>
        <div class="box child3">3</div>
    </div>
</head>
<body>
    
</body>
</html>
