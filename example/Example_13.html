<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cafe</title>
    <style>
        .menu{
            width: 400px; 
            padding: 20px;
            background-color: rgb(247, 237, 208);
            border: 1px solid #ccc;
            border-radius : 15px;
            padding-bottom: 5px;
            
        }
        h1{
            text-align: center;
             letter-spacing : 5px;
             font-size: 25px;
        }
        ul{
            padding: 0;
            text-align: left;
            list-style: none;
        }
        li{
            margin-bottom: 15px;
            /* border-bottom-style: dashed ; */
            border-bottom: 1px dashed #757474;
            padding-bottom: 10px;
        }
        span{
            float: right;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Café Menu</h1>
        <ul>
            <li>
                AMERICANO <span>$3.50</span>
            </li>
            <li>
                LATTE <span>$4.00</span>
            </li>
            <li>
                CAPPUCCINO <span>$4.20</span>
            </li>
        </ul>
    </div>
</body>
</html>
