<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마켓컬리 회원가입</title>
    <link rel="stylesheet" href="/StyleCss/kuri_join.css">
</head>
<body>
    <h1>회원가입</h1>
    <form>
        <p class="form-text"><span class="sp">*</span>필수입력사항</p>
        <ul>
            <li>
                <label class="form-label" for="ID">아이디<span class="sp" >*</span></label>
                <input type="text" id="ID" placeholder="아이디를 입력해주세요">
            </li>
            <li>
                <label class="form-label" for="password">비밀번호<span class="sp">*</span></label>
                <input type="password" id="password" placeholder="비밀번호를 입력해주세요">
            </li>
            <li>
                <label class="form-label" for="passwordchk">비밀번호확인<span class="sp">*</span></label>
                <input type="password" id="passwordchk" placeholder="비밀번호를 한번 더 입력해주세요">
            </li>
            <li>
                <label class="form-label" for="name">이름<span class="sp">*</span></label>
                <input type="text" id="name" placeholder="이름을 입력해주세요">
            </li>
            <li>
                <label class="form-label email" for="email">이메일<span class="sp">*</span></label>
                <input class="email" type ="text" id="email" placeholder="예:markeykurly">
                <select>
                    <option value="" disabled selected>선택하기</option>
                    <option value="" >naver.com</option>
                    <option value="" >gmail.com</option>
                    <option value="" >daum.net</option>
                </select>
            </li>
            <li>
                <label class="form-label" for="tel">휴대폰<span class="sp">*</span></label>
                <input type="tel" id="tel" placeholder="숫자만 입력해주세요">
            </li>
            <li>
                <label class="form-label" for="address">주소<span class="sp">*</span></label>
                <button class="form-btn">🔍️주소검색</button>
                <p class="info">배송지에 따라 상품 정보가 달라질 수 있습니다.</p>
            </li>
            <li>
                <label class="form-label" for="gender">성별</label>
                <input type="radio" name="gen" id="man">
                <label class="gender" for = "man">남자</label>
                <input type="radio" name="gen" id="woman">
                <label class="gender" for="woman">여자</label>
                <input type="radio" name="gen" id="x">
                <label class="gender" for="x">선택안함</label>
            </li>
            <li class="bir1">
                <label id="생년월일">생년월일</label>
                <input class="bir" type="text" id="yy" placeholder="YY">/
                <input class="bir" type="text" id="mm" placeholder="mm">/
                <input class="bir" type="text" id="dd" placeholder="dd">
            </li>
            <li>

            </li>
            <li>
                <label class="form-label" for="recommend" >추가입력 사항</label>
                <input type="radio" name="rec1" id="rec1">
                <label class="reid">친구초대 추천인 아이디</>
            </li>
        </ul>
        <hr class="dline" style="color: black;" width="550px">
        <ul>
            <li>
                <label for="agree">이용약관동의<span class="sp">*</span></label>
            </li>
            <div class="agree">
            <li>
                <input type="checkbox"> 전체 동의합니다<span style="color: #888;"><span style="font-size: 14px;">(필수)</span></span><br>
                <p class="info"> 선택 항목에 동의하지 않은 경우도 회원가입 및 일반적인 서비스를 이용할 수 있습니다.</p>
            </li>
            <li>
                
            </li>
            <li>
                <input type="checkbox"> 컬리 이용약관 동의<span style="color: #888;"><span style="font-size: 14px;">(필수)</span></span>
            </li>
            <li>
                <input type="checkbox"> 개인정보 수집·이용<span style="color: #888;"><span style="font-size: 14px;">(필수)</span></span>      
            </li>
            <li>
                <input type="checkbox"> 이벤트 및 혜택정보 발송을 위한 수십·이용 <span style="color: #888;"><span style="font-size: 14px;">(선택)</span></span>      
            </li>
            <li>
                <input type="checkbox"> 광고성 정보 수신 <span style="color: #888;"><span style="font-size: 14px;">(선택)</span></span>      
            </li>
            <li class="sns">    
                <input type="checkbox"> 문자 <span style="color: #888;"><span style="font-size: 14px;">(선택)</span></span>      
                <input type="checkbox"> 이메일 <span style="color: #888;"><span style="font-size: 14px;">(선택)</span></span>      
                <input type="checkbox"> 카카오 <span style="color: #888;"><span style="font-size: 14px;">(선택)</span></span>      
            </li>
            <li>
                <input type="checkbox"> 본인은 만 14세 이상입니다. <span style="color: #888;"><span style="font-size: 14px;">(필수)</span></span>      
                <p></p>
            </li>
            <li>
            </div>          
                <button class="form-btn2" type="submit">가입하기</button>
            </li> 
        </ul>
    </form>
</body>
</html>
