<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표연습</title>
    <!-- <style>태그는 아래 HTML 태그들을 이쁘게 꾸며주는 태그이다. -->
        <style>
            /* css 작성방법 3가지
                1. 태그이름을 이용한 CSS
                2. class명을 이용한 CSS
                3. id명을 이용한 CSS
                */
                body{
                    /*글꼴의 크기를 지정하는 CSS 명령어*/
                    front-size : 14px;
                }
                table{
                    /* 테이블의 가로크리를 지정하는 CSS */
                    width: 800px;
                    /* 셀 사이의 간격을 없애고 테두리를 합침 */
                    border-collapse: collapse;
                    /* 선그리기 : 선사이즈, 실선, 검정색 */
                }
                /* 공통으로 들어가는 CSS해야할 경우는 th, td형식으로 ,(콤마)로 나열한다. */
                thead th,
                tbody td{
                    border: 1px solid black;
                    /* 테이블안에 문자 가운데 정렬 CSS */
                    text-align: center;
                    /* 표안에 한 줄 안 속에 여백을 주고싶을 때 */
                    /* padding : spx(위, 아래, 왼쪽, 오른쪽) */
                    padding: 5px;
                }
                thead th{
                    /* th부분에 배경색을 지정하는 CSS */
                    background-color: dodgerblue;
                    /* 글꼴색 */
                    color: #fff;
                }
                caption{
                    text-align: right;
                    /* 텍스트의 바깥쪽 여백을 지정하는 CSS */
                    /* margin:5px(상하좌우) */
                    /* margin-bottom : 10px (아래쪽만 여백 지정) */
                    margin-bottom: 10px ;
                }


        </style>
    </head>
<body>
    <!-- 테이블 작성시 웹표준과 웹접근성을 고려하여
        <thead>, <tbody>, <tfoot> 태그를 이용하여 작성함을 원칙으로 한다. 
    -->
            <table>
                <caption>부가세(VAT) 포함된 실제 지불금액 입니다.</caption>
                <!-- thead 부분으로 필드명 기재 -->
                 <thead>
                    <tr>
                        <th>상품명</th>
                        <th>월정액</th>
                        <th>제공혜택</th>
                    </tr>
                 </thead>
                 <!-- tbody 부분으로 데이터 기재 -->
                  <tbody>
                      <tr>
                          <td>지상파 무제한 즐기기</td>
                          <td>14,300</td>
                          <td>
                              지상파 3사의 모든 드라마, 예능 프로그램을 무제한 볼 수 있는 인기 월정액서비스
                          </td>
                      </tr>
                    <tr>
                        <td>CJEMM 무제한 즐기기</td>
                        <td>14,300</td>
                        <td>
                            모든 드라마, 예능 프로그램을 무제한 볼 수 있는 인기 월정액서비스
                        </td>
                    </tr>
                    <tr>
                        <td>JTBC 무제한 즐기기</td>
                        <td>7,700</td>
                        <td>
                            JTBC 드라마, 예능 프로그램을 무제한으로 즐길 수 있는 인기 월정액 서비스
                        </td>
                    </tr>
                  </tbody>
            </table>

            <!-- 병합 테이블  -->
             <hr/>

             <table>
                <thead>
                    <tr>
                        <th colspan ="4">기온</th>
                    </tr>
                    <tr>                                                               
                        <th>월</th>
                        <th>높음</th>
                        <th>낮음</th>
                        <th>평균</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1월</td>
                        <td>48</td>
                        <td>36</td>
                        <td>43</td>
                    </tr>
                    <tr>
                        <td>2월</td>
                        <td>35</td>
                        <td>34</td>
                        <td rowspan="2">40</td>
                    </tr>
                    <tr>
                        <td>3월</td>
                        <td>44</td>
                        <td>22</td>
                    </tr>
                    <tr>
                        <td>4월</td>
                        <td>56</td>
                        <td>42</td>
                        <td>43</td>
                    </tr>
                </tbody>
             </table>
</body>
</html>
