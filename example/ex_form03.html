<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>여름방학 특강 신청하기</h3>
    <form action="#" method="get">
            <fieldset>
                <legend>교육과정</legend>
                <ul>
                    <li>
                        <label>영어회화</label>
                        <input type="text" value="오전 9:00~11:00" readonly>(초급레벨)
                    </li>
                </ul>
            </fieldset>
            <fieldset>
                <legend>신청자 기본 정보</legend>
                    <ul>
                        <li>
                            <label>이름</label>
                            <input type="text">
                        </li>
                        <li>
                            <label>이메일</label>
                            <input type="email">
                        </li>
                        <li>
                            <label>비밀번호</label>
                            <input type="password">
                        </li>
                        <li>
                            <form>
                                <label>학과</label>
                                <select>
                                    <option value="">학과를 선택하세요</option>
                                    <option value="컴퓨터공학과">컴퓨터공학과</option>
                                    <option value="국어국문학과">국어국문학과</option>
                                    <option value="영어영문학과">영어영문학과</option>
                                    <option value="전자 융합과">전자 융합과</option>
                                </select>
                            </form>
                        </li>
                        <li>
                            <label>성별</label>
                            <input type="radio" name="gender">남자
                            <input type="radio" name="gender">여자
                        </li>
                        <li>
                            <label>관심사</label>
                            <input type="checkbox" name="travle" checked>여행
                            <input type="checkbox" name="travle" >게임
                            <input type="checkbox" name="travle" >공연
                            <input type="checkbox" name="travle" >운동
                            <input type="checkbox" name="travle" >기타
                        </li>
                    </ul>
            </fieldset>
            <button type="submit">수강신청</button>
            <button type="reset">다시쓰기</button>
        </form>
</body>
</html>
