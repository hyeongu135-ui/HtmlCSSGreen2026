    <title>flex</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        html{height: 100%;}
        body{

        }

        img{

        }
        .image{

        }
        .zzim{

            right: 0;
            bottom: 0;
        }
        .price{
            color: #cecccc;
        }
        .st{
            font-weight: bold;
            color: red;
        }
        span{
            color: black;
        }
    </style>
</head>
